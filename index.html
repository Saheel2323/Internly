<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2432">
<meta name="description" content="A private, on-device internship log and AI report builder.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Internly: Internship Log & Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   TOKENS
   Color   ink #1B2432 (text/headers), paper #F1ECE0 (bg),
           raised #FFFFFF (panels), brass #A9782F (primary accent),
           moss #4B6650 (impact/positive), rust #A24936 (destructive),
           line #DCD3BF (hairline borders)
   Type    Source Serif 4 -> headings, ledger numbers, report body
           IBM Plex Sans  -> UI chrome, form labels, buttons
           IBM Plex Mono  -> dates, small meta stamps
   Layout  left ledger-tab rail + right page. Content reads like a
           bound logbook: hairline rules, numbered entries (a true
           sequence), no card-soup, no drop shadows.
------------------------------------------------------------------*/
:root{
  --ink:#1B2432; --ink-soft:#4B5468;
  --paper:#F1ECE0; --raised:#FFFFFF;
  --brass:#A9782F; --brass-deep:#8A6224;
  --moss:#4B6650; --moss-deep:#37493B;
  --rust:#A24936;
  --line:#DCD3BF; --line-soft:#E9E2D2;
  --shadow: 0 1px 0 rgba(27,36,50,.06);
  color-scheme: light;
}
:root:not([data-theme="light"]) {}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDE7D9; --ink-soft:#B9B2A0;
    --paper:#181511; --raised:#211D17;
    --brass:#D6A65A; --brass-deep:#E9BE7C;
    --moss:#7FA089; --moss-deep:#9CC0A6;
    --rust:#D98A78;
    --line:#3A342A; --line-soft:#2A251E;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ink:#EDE7D9; --ink-soft:#B9B2A0;
  --paper:#181511; --raised:#211D17;
  --brass:#D6A65A; --brass-deep:#E9BE7C;
  --moss:#7FA089; --moss-deep:#9CC0A6;
  --rust:#D98A78;
  --line:#3A342A; --line-soft:#2A251E;
  --shadow: 0 1px 0 rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--brass); color:#fff;}
a{color:var(--brass-deep);}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}

/* ---------- shell ---------- */
.shell{
  display:flex; min-height:100%; max-width:1180px; margin:0 auto;
}
.rail{
  width:220px; flex:0 0 220px; padding:28px 14px;
  border-right:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); align-self:flex-start;
  height:100dvh;
}
.brand{
  padding:0 10px 22px; margin-bottom:18px; border-bottom:1px solid var(--line);
}
.brand .mark{font-size:1.5rem; font-weight:600; letter-spacing:-0.01em;}
.brand .sub{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
nav.tabs{display:flex; flex-direction:column; gap:2px;}
nav.tabs button{
  text-align:left; background:none; border:none; color:var(--ink-soft);
  font-size:.92rem; padding:9px 10px; border-radius:3px; cursor:pointer;
  display:flex; align-items:center; gap:9px;
}
nav.tabs button .n{
  font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--line);
  width:14px;
}
nav.tabs button:hover{background:var(--line-soft); color:var(--ink);}
nav.tabs button.active{background:var(--ink); color:var(--paper);}
nav.tabs button.active .n{color:var(--brass);}
.rail-foot{margin-top:20px; padding-top:14px; border-top:1px solid var(--line); font-size:.72rem; color:var(--ink-soft);}
.status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--moss); margin-right:6px;}
.status-dot.off{background:var(--rust);}

main{flex:1; min-width:0; padding:36px 40px 80px;}
.page-head{margin-bottom:28px;}
.page-head h1{font-size:1.7rem; margin:0 0 4px; font-weight:600;}
.page-head p{margin:0; color:var(--ink-soft); font-size:.92rem; max-width:60ch;}

/* ---------- form elements ---------- */
label{display:block; font-size:.78rem; color:var(--ink-soft); margin-bottom:5px; font-weight:500;}
input[type=text],input[type=date],textarea,select{
  width:100%; background:var(--raised); border:1px solid var(--line);
  border-radius:3px; padding:9px 11px; font-size:.92rem; color:var(--ink);
  font-family:inherit;
}
textarea{resize:vertical; min-height:74px; line-height:1.45;}
input:focus,textarea:focus,select:focus{border-color:var(--brass);}
.field{margin-bottom:16px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.hint{font-size:.74rem; color:var(--ink-soft); margin-top:4px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:9px 16px; border-radius:3px; font-size:.86rem; font-weight:500;
}
.btn:hover{background:var(--ink-soft);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
.btn.secondary:hover{border-color:var(--ink);}
.btn.brass{background:var(--brass); border-color:var(--brass); color:#fff;}
.btn.brass:hover{background:var(--brass-deep); border-color:var(--brass-deep);}
.btn.ghost{background:none; border:none; color:var(--ink-soft); padding:4px 6px;}
.btn.ghost:hover{color:var(--rust);}

.panel{
  background:var(--raised); border:1px solid var(--line); border-radius:5px;
  padding:22px 24px; box-shadow:var(--shadow);
}

/* ---------- ledger entries ---------- */
.ledger-item{
  display:grid; grid-template-columns:52px 1fr auto; gap:16px;
  padding:16px 0; border-bottom:1px solid var(--line-soft);
}
.ledger-item:last-child{border-bottom:none;}
.ledger-num{font-family:'IBM Plex Mono',monospace; color:var(--line); font-size:.78rem; padding-top:3px;}
.ledger-date{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--brass-deep); margin-bottom:3px;}
.ledger-proj{font-weight:600; margin:0 0 6px;}
.ledger-body p{margin:0 0 6px; font-size:.88rem; line-height:1.5;}
.ledger-body .lbl{color:var(--ink-soft); font-size:.72rem; text-transform:none; margin-right:4px;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.tag{font-size:.7rem; background:var(--line-soft); color:var(--ink-soft); padding:2px 8px; border-radius:20px;}
.ledger-actions{display:flex; flex-direction:column; gap:4px; align-items:flex-end;}

.empty{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty .serif{font-size:1.15rem; color:var(--ink); margin-bottom:6px;}

/* ---------- stats strip ---------- */
.stats{display:flex; gap:28px; margin-bottom:26px; flex-wrap:wrap;}
.stat b{display:block; font-family:'Source Serif 4',serif; font-size:1.5rem; font-weight:600;}
.stat span{font-size:.72rem; color:var(--ink-soft);}

/* ---------- project group heading ---------- */
.group-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin:26px 0 4px; padding-bottom:6px; border-bottom:1px solid var(--ink);
}
.group-head:first-child{margin-top:0;}
.group-head h3{margin:0; font-size:1.02rem; font-weight:600;}
.group-head .count{font-size:.72rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

/* ---------- report ---------- */
.report-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
.report-page{
  background:var(--raised); border:1px solid var(--line); border-radius:5px;
  padding:44px 52px; max-width:74ch; margin:0 auto;
}
.report-page h1{font-size:1.6rem; margin:0 0 4px;}
.report-page h2{font-size:1.22rem; margin:32px 0 10px; padding-top:14px; border-top:1px solid var(--line);}
.report-page h2:first-of-type{border-top:none; padding-top:0;}
.report-page h3{font-size:1.02rem; margin:20px 0 8px; color:var(--brass-deep);}
.report-page p{line-height:1.7; margin:0 0 12px; font-size:.95rem;}
.report-page ul{padding-left:22px; margin:0 0 12px;}
.report-page li{margin-bottom:5px; line-height:1.6; font-size:.95rem;}
.report-page hr{border:none; border-top:1px solid var(--line); margin:26px 0;}
.report-page strong{color:var(--ink);}
.report-empty{text-align:center; padding:70px 20px;}
.think{
  display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:.9rem;
  padding:16px 0;
}
.spinner{
  width:14px; height:14px; border-radius:50%; border:2px solid var(--line);
  border-top-color:var(--brass); animation:spin 0.8s linear infinite; flex:0 0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

.banner{
  border:1px solid var(--line); background:var(--line-soft); color:var(--ink-soft);
  padding:10px 14px; border-radius:4px; font-size:.82rem; margin-bottom:20px;
}
.banner.warn{border-color:var(--rust); color:var(--rust); background:transparent;}

/* skills chip input */
.chip-input{display:flex; flex-wrap:wrap; gap:6px; border:1px solid var(--line); border-radius:3px; padding:7px 9px; background:var(--raised);}
.chip-input input{border:none; flex:1; min-width:120px; padding:3px; background:none;}
.chip-input input:focus{outline:none;}
.chip{display:flex; align-items:center; gap:5px; background:var(--moss); color:#fff; font-size:.74rem; padding:3px 8px; border-radius:20px;}
.chip button{background:none; border:none; color:#fff; cursor:pointer; opacity:.8; font-size:.85rem; line-height:1; padding:0;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(27,36,50,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
.modal{background:var(--raised); border-radius:6px; max-width:420px; width:100%; padding:22px 24px; border:1px solid var(--line);}
.modal h3{margin:0 0 8px;}
.modal p{font-size:.88rem; color:var(--ink-soft); line-height:1.5;}
.modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}

@media (max-width:820px){
  .shell{flex-direction:column;}
  .rail{
    width:100%; flex:none; position:sticky; top:0; height:auto;
    border-right:none; border-bottom:1px solid var(--line);
    padding:14px 16px; display:flex; align-items:center; gap:14px; background:var(--paper); z-index:10;
  }
  .brand{border:none; padding:0; margin:0;}
  .brand .sub{display:none;}
  nav.tabs{flex-direction:row; overflow-x:auto;}
  nav.tabs button{white-space:nowrap;}
  .rail-foot{display:none;}
  main{padding:22px 18px 60px;}
  .row2{grid-template-columns:1fr;}
  .report-page{padding:26px 20px;}
  .ledger-item{grid-template-columns:34px 1fr; }
  .ledger-actions{grid-column:1/-1; flex-direction:row; justify-content:flex-end;}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">Internly</div>
      <div class="sub">Internship log &amp; report builder</div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="log" class="active"><span class="n">01</span> Today's entry</button>
      <button data-tab="entries"><span class="n">02</span> All entries</button>
      <button data-tab="report"><span class="n">03</span> Generate report</button>
      <button data-tab="settings"><span class="n">04</span> Internship details</button>
    </nav>
    <div class="rail-foot" id="syncStatus"><span class="status-dot"></span>Connecting…</div>
  </aside>

  <main id="main">
    <!-- content injected per tab -->
  </main>
</div>

<div id="modalRoot"></div>
<footer style="max-width:1180px; margin:0 auto; padding:0 24px 24px; color:var(--ink-soft); font-size:.72rem;">
  Internly · Local-first storage · Keep a backup of your data
</footer>

<script>
(function(){
"use strict";

/* ============================= state ============================= */
const state = {
  tab: 'log',
  db: null, user: null, sample: null, downloads: null,
  uid: null,
  online: false,
  aiKey: '',
  localDb: null,
  entries: [],        // [{id,date,project,workDone,impact,skills[],challenges,createdAt}]
  settings: { studentName:'', company:'', role:'', department:'', mentor:'', industry:'', startDate:'', endDate:'' },
  settingsLoaded:false,
  editingId: null,
  report: { markdown:'', generatedAt:null },
  reportBusy:false,
  reportError:null,
  skillDraft: [],
  unsub: [],
};

/* ============================ helpers ============================= */
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function todayISO(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2)+Date.now()); }

/* very small markdown -> html renderer, enough for the report shape we ask for */
function renderMarkdown(md){
  const lines = md.replace(/\r\n/g,'\n').split('\n');
  let html=''; let inList=false;
  const closeList=()=>{ if(inList){ html+='</ul>'; inList=false; } };
  for(let raw of lines){
    const line = raw.trim();
    if(line==='' ){ closeList(); continue; }
    if(/^---+$/.test(line)){ closeList(); html+='<hr>'; continue; }
    let m;
    if((m=line.match(/^###\s+(.*)/))){ closeList(); html+=`<h3>${inline(m[1])}</h3>`; continue; }
    if((m=line.match(/^##\s+(.*)/))){ closeList(); html+=`<h2>${inline(m[1])}</h2>`; continue; }
    if((m=line.match(/^#\s+(.*)/))){ closeList(); html+=`<h1>${inline(m[1])}</h1>`; continue; }
    if((m=line.match(/^[-*]\s+(.*)/))){ if(!inList){ html+='<ul>'; inList=true; } html+=`<li>${inline(m[1])}</li>`; continue; }
    if((m=line.match(/^\d+\.\s+(.*)/))){ if(!inList){ html+='<ul>'; inList=true; } html+=`<li>${inline(m[1])}</li>`; continue; }
    closeList();
    html+=`<p>${inline(line)}</p>`;
  }
  closeList();
  return html;
  function inline(s){
    s = escapeHtml(s);
    s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g,'<em>$1</em>');
    return s;
  }
}

/* ============================ local-first storage ============================= */
const STORAGE_KEY = 'internly-local-v1';

function openLocalDb(){
  return new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open('InternlyLocalDB', 1);
    req.onupgradeneeded = ()=> {
      const db = req.result;
      if(!db.objectStoreNames.contains('records')) db.createObjectStore('records');
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error || new Error('Could not open local database'));
  });
}

async function loadLocal(){
  try{
    state.localDb = await openLocalDb();
    const data = await new Promise((resolve, reject)=>{
      const tx = state.localDb.transaction('records','readonly');
      const req = tx.objectStore('records').get('app');
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>reject(req.error);
    });
    if(data) applyLocalData(data);
    else {
      const fallback = localStorage.getItem(STORAGE_KEY);
      if(fallback) applyLocalData(JSON.parse(fallback));
    }
  }catch(e){
    try{
      const fallback = localStorage.getItem(STORAGE_KEY);
      if(fallback) applyLocalData(JSON.parse(fallback));
    }catch(ignore){}
  }
  state.aiKey = localStorage.getItem('internly-gemini-key') || '';
}

function applyLocalData(data){
  if(!data || typeof data !== 'object') return;
  if(Array.isArray(data.entries)) state.entries = data.entries;
  if(data.settings && typeof data.settings === 'object'){
    state.settings = Object.assign({}, state.settings, data.settings);
  }
  if(data.report && typeof data.report === 'object'){
    state.report = {markdown:data.report.markdown || '', generatedAt:data.report.generatedAt || null};
  }
}

async function persistLocal(){
  const data = {
    version: 1,
    entries: state.entries,
    settings: state.settings,
    report: state.report,
    updatedAt: new Date().toISOString()
  };
  try{
    if(state.localDb){
      await new Promise((resolve, reject)=>{
        const tx = state.localDb.transaction('records','readwrite');
        tx.objectStore('records').put(data, 'app');
        tx.oncomplete = ()=>resolve();
        tx.onerror = ()=>reject(tx.error);
        tx.onabort = ()=>reject(tx.error || new Error('Save aborted'));
      });
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
  }catch(e){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(err){ alert('Internly could not save. Your browser storage may be full. Export a backup and free some space.'); }
  }
}

async function boot(){
  await loadLocal();
  state.settingsLoaded = true;
  renderSyncStatus();
  render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }
}

async function saveSettings(next){
  state.settings = Object.assign({}, state.settings, next);
  await persistLocal();
  render();
}

async function saveEntry(entry){
  if(entry.id){
    const i = state.entries.findIndex(x=>x.id===entry.id);
    if(i>-1) state.entries[i] = entry;
  } else {
    entry.id = uuid();
    entry.createdAt = new Date().toISOString();
    state.entries.unshift(entry);
  }
  await persistLocal();
  render();
}

async function deleteEntry(id){
  state.entries = state.entries.filter(e=>e.id!==id);
  await persistLocal();
  render();
}

/* ============================ report generation ============================= */
function buildPrompt(){
  const s = state.settings;
  const grouped = {};
  state.entries.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'')).forEach(e=>{
    const key = e.project || 'General';
    (grouped[key]=grouped[key]||[]).push(e);
  });
  let projText = '';
  Object.keys(grouped).forEach(proj=>{
    projText += `\n### Project / problem statement: ${proj}\n`;
    grouped[proj].forEach(e=>{
      projText += `- Date: ${e.date||'n/a'} | Work done: ${e.workDone||'—'} | Impact/outcome: ${e.impact||'—'}`;
      if(e.challenges) projText += ` | Challenges: ${e.challenges}`;
      if(e.skills && e.skills.length) projText += ` | Skills/tools used: ${e.skills.join(', ')}`;
      projText += '\n';
    });
  });
  const allSkills = Array.from(new Set(state.entries.flatMap(e=>e.skills||[])));

  return `You are helping an MBA student turn their raw daily internship log into a polished, submission-ready Summer Internship Report, in the standard academic format Indian B-schools expect.

STUDENT & INTERNSHIP DETAILS
- Student name: ${s.studentName||'(not provided)'}
- Company: ${s.company||'(not provided)'}
- Department/function: ${s.department||'(not provided)'}
- Role/designation: ${s.role||'(not provided)'}
- Industry: ${s.industry||'(not provided)'}
- Mentor/supervisor: ${s.mentor||'(not provided)'}
- Duration: ${s.startDate||'(start date not provided)'} to ${s.endDate||'(end date not provided)'}

RAW DAILY LOG, grouped by project/problem statement (chronological within each):
${projText || '(no entries logged yet)'}

Distinct skills/tools mentioned across the log: ${allSkills.join(', ') || '(none logged)'}

Write the full report in clean Markdown with these sections, in this order, using "##" for each section heading and "###" for sub-headings:
## Executive Summary
A tight overview (one paragraph) of the internship, the company, and the headline impact delivered.
## Company and Industry Overview
Write this from the company/industry named above; if details are thin, keep it brief and general rather than inventing facts.
## Objectives of the Internship
3-5 objectives inferred from the work logged.
## Methodology / Approach
How the student approached the work — tools, frameworks, ways of working — inferred from the log.
## Projects and Key Contributions
One "###" sub-heading per project/problem statement listed above. For each: the problem statement, a narrative (not bullet-by-bullet restating of the log, but a coherent account) of the work done, and the impact/results, quantified wherever the log gives numbers.
## Skills and Competencies Gained
Tie back to the skills/tools list and the work described.
## Challenges and Learnings
Drawn from any challenges mentioned in the log; keep this honest and specific, not generic.
## Recommendations
2-4 recommendations the student could offer the company, grounded in the work described.
## Conclusion
A short closing reflection.

Rules: Only use facts present in the log and details above — never invent metrics, company facts, or events that were not logged. Where information is missing, write around it gracefully rather than fabricating. Keep the tone professional and reflective, first person ("I"). Do not include a title page, table of contents, or the words "Executive Summary" restated elsewhere. Do not wrap the whole answer in a code fence.`;
}

async function generateReport(regenerate){
  if(!state.aiKey){
    state.reportError = 'Add your Gemini API key in Internship details → AI report generation.';
    render();
    return;
  }
  if(state.entries.length===0){
    state.reportError = 'Log at least one day before generating a report.';
    render();
    return;
  }
  state.reportBusy = true;
  state.reportError = null;
  render();
  try{
    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-goog-api-key':state.aiKey
      },
      body:JSON.stringify({
        contents:[{parts:[{text:buildPrompt()}]}],
        generationConfig:{temperature:0.35, maxOutputTokens:8192}
      })
    });
    const payload = await response.json().catch(()=>({}));
    if(!response.ok){
      const detail = payload.error && payload.error.message ? payload.error.message : `Request failed (${response.status})`;
      throw new Error(detail);
    }
    const textOut = (payload.candidates || [])
      .flatMap(c=>(c.content && c.content.parts) || [])
      .map(p=>p.text || '')
      .join('\\n').trim();
    if(!textOut) throw new Error('The AI provider returned an empty response. Try again.');
    state.report = {markdown:textOut, generatedAt:new Date().toISOString()};
    await persistLocal();
  }catch(e){
    state.reportError = e.message || 'Could not generate the report. Check your connection and API key.';
  }finally{
    state.reportBusy = false;
    render();
  }
}

async function downloadReport(ext){
  if(!state.report.markdown) return;
  const s = state.settings;
  const filename = `Internship_Report_${(s.studentName||'draft').replace(/\s+/g,'_')}.${ext}`;
  const blob = new Blob([state.report.markdown], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---- Tab: log ---- */
function renderLogTab(){
  const wrap = el('div');
  wrap.appendChild(el('div',{class:'page-head'},[
    el('h1',{class:'serif'}, ["Log today's work"]),
    el('p',{}, ["A minute now saves hours later — problem statement, what you did, and the impact. This is the raw material your final report is built from."]),
  ]));
  wrap.appendChild(el('div',{class:'banner'},['Your entries are saved on this device. Export a backup before clearing browser data or changing phones.']));

  const editing = state.entries.find(e=>e.id===state.editingId);
  const draft = editing ? Object.assign({}, editing) : { date: todayISO(), project:'', workDone:'', impact:'', challenges:'', skills:[] };
  state.skillDraft = draft.skills ? draft.skills.slice() : [];

  const projectNames = Array.from(new Set(state.entries.map(e=>e.project).filter(Boolean)));

  const form = el('form',{class:'panel'});
  const row = el('div',{class:'row2'});
  const dateField = el('div',{class:'field'},[
    el('label',{for:'f_date'},['Date']),
    el('input',{type:'date', id:'f_date', value:draft.date, required:'required'}),
  ]);
  const projInput = el('input',{type:'text', id:'f_project', list:'projList', value:draft.project, placeholder:'e.g. Retail pricing analysis', required:'required'});
  const dl = el('datalist',{id:'projList'});
  projectNames.forEach(p=>dl.appendChild(el('option',{value:p})));
  const projField = el('div',{class:'field'},[
    el('label',{for:'f_project'},['Problem statement / project']),
    projInput, dl,
  ]);
  row.appendChild(dateField); row.appendChild(projField);
  form.appendChild(row);

  form.appendChild(el('div',{class:'field'},[
    el('label',{for:'f_work'},['Work done today']),
    el('textarea',{id:'f_work', placeholder:'What did you actually do — analysis run, meetings, deliverables drafted…'}, [draft.workDone]),
  ]));
  form.appendChild(el('div',{class:'field'},[
    el('label',{for:'f_impact'},['Impact / outcome']),
    el('textarea',{id:'f_impact', placeholder:'What changed because of it — a number, a decision made, a process improved'}, [draft.impact]),
  ]));
  form.appendChild(el('div',{class:'field'},[
    el('label',{for:'f_challenge'},['Challenges faced (optional)']),
    el('textarea',{id:'f_challenge', placeholder:'Anything that slowed you down or that you had to work around'}, [draft.challenges||'']),
  ]));

  const skillField = el('div',{class:'field'});
  skillField.appendChild(el('label',{},['Skills / tools used (optional)']));
  const chipBox = el('div',{class:'chip-input', id:'chipBox'});
  const chipInput = el('input',{type:'text', id:'skillInput', placeholder:'Type a skill and press Enter — Excel, stakeholder mgmt…'});
  function redrawChips(){
    chipBox.querySelectorAll('.chip').forEach(c=>c.remove());
    state.skillDraft.forEach((s,i)=>{
      const chip = el('span',{class:'chip'},[s, el('button',{type:'button', onclick:()=>{ state.skillDraft.splice(i,1); redrawChips(); }},['×'])]);
      chipBox.insertBefore(chip, chipInput);
    });
  }
  chipInput.addEventListener('keydown', (ev)=>{
    if(ev.key==='Enter' || ev.key===','){
      ev.preventDefault();
      const v = chipInput.value.trim();
      if(v && !state.skillDraft.includes(v)){ state.skillDraft.push(v); redrawChips(); }
      chipInput.value='';
    }
  });
  chipBox.appendChild(chipInput);
  skillField.appendChild(chipBox);
  redrawChips();
  form.appendChild(skillField);

  const actions = el('div',{style:'display:flex; gap:10px; margin-top:6px;'});
  actions.appendChild(el('button',{class:'btn brass', type:'submit'}, [editing ? 'Save changes' : 'Add entry']));
  if(editing){
    actions.appendChild(el('button',{class:'btn secondary', type:'button', onclick:()=>{ state.editingId=null; render(); }}, ['Cancel edit']));
  }
  form.appendChild(actions);

  form.addEventListener('submit', (ev)=>{
    ev.preventDefault();
    const entry = {
      id: editing ? editing.id : undefined,
      date: form.querySelector('#f_date').value,
      project: projInput.value.trim(),
      workDone: form.querySelector('#f_work').value.trim(),
      impact: form.querySelector('#f_impact').value.trim(),
      challenges: form.querySelector('#f_challenge').value.trim(),
      skills: state.skillDraft.slice(),
    };
    saveEntry(entry);
    state.editingId = null;
    state.tab = 'entries';
    render();
  });

  wrap.appendChild(form);
  return wrap;
}

/* ---- Tab: entries ---- */
function renderEntriesTab(){
  const wrap = el('div');
  wrap.appendChild(el('div',{class:'page-head'},[
    el('h1',{class:'serif'},['All entries']),
    el('p',{},['Everything you\'ve logged, grouped by project. Edit or remove anything before you generate the report.']),
  ]));

  if(state.entries.length===0){
    wrap.appendChild(el('div',{class:'panel'},[
      el('div',{class:'empty'},[
        el('div',{class:'serif'},['Nothing logged yet']),
        el('p',{},['Start with today\'s entry — it takes under a minute.']),
      ])
    ]));
    return wrap;
  }

  const projectCount = new Set(state.entries.map(e=>e.project)).size;
  const stats = el('div',{class:'stats'},[
    el('div',{class:'stat'},[el('b',{},[String(state.entries.length)]), el('span',{},['days logged'])]),
    el('div',{class:'stat'},[el('b',{},[String(projectCount)]), el('span',{},['projects tracked'])]),
  ]);
  wrap.appendChild(stats);

  const panel = el('div',{class:'panel'});
  const grouped = {};
  state.entries.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')).forEach(e=>{
    const key = e.project || 'Uncategorized';
    (grouped[key]=grouped[key]||[]).push(e);
  });
  Object.keys(grouped).sort().forEach(proj=>{
    panel.appendChild(el('div',{class:'group-head'},[
      el('h3',{},[proj]),
      el('span',{class:'count'},[grouped[proj].length + ' entr' + (grouped[proj].length===1?'y':'ies')]),
    ]));
    grouped[proj].forEach((e,idx)=>{
      const item = el('div',{class:'ledger-item'});
      item.appendChild(el('div',{class:'ledger-num'},[String(idx+1).padStart(2,'0')]));
      const body = el('div',{class:'ledger-body'});
      body.appendChild(el('div',{class:'ledger-date'},[fmtDate(e.date)]));
      if(e.workDone) body.appendChild(el('p',{},[el('span',{class:'lbl'},['Work — ']), e.workDone]));
      if(e.impact) body.appendChild(el('p',{},[el('span',{class:'lbl'},['Impact — ']), e.impact]));
      if(e.challenges) body.appendChild(el('p',{},[el('span',{class:'lbl'},['Challenge — ']), e.challenges]));
      if(e.skills && e.skills.length){
        const tr = el('div',{class:'tag-row'});
        e.skills.forEach(s=>tr.appendChild(el('span',{class:'tag'},[s])));
        body.appendChild(tr);
      }
      item.appendChild(body);
      const acts = el('div',{class:'ledger-actions'});
      acts.appendChild(el('button',{class:'btn ghost', onclick:()=>{ state.editingId=e.id; state.tab='log'; render(); }},['Edit']));
      acts.appendChild(el('button',{class:'btn ghost', onclick:()=>confirmDelete(e.id)},['Delete']));
      item.appendChild(acts);
      panel.appendChild(item);
    });
  });
  wrap.appendChild(panel);
  return wrap;
}

function confirmDelete(id){
  const root = document.getElementById('modalRoot');
  root.innerHTML='';
  const modal = el('div',{class:'overlay', onclick:(ev)=>{ if(ev.target===modal) root.innerHTML=''; }},[
    el('div',{class:'modal'},[
      el('h3',{class:'serif'},['Delete this entry?']),
      el('p',{},['This can\'t be undone. Your report won\'t reflect it until you regenerate.']),
      el('div',{class:'actions'},[
        el('button',{class:'btn secondary', onclick:()=>{ root.innerHTML=''; }},['Cancel']),
        el('button',{class:'btn brass', style:'background:var(--rust); border-color:var(--rust);', onclick:()=>{ deleteEntry(id); root.innerHTML=''; }},['Delete']),

    ])
  ]);
  root.appendChild(modal);
}

function exportBackup(){
  const data = {
    app:'Internly',
    version:1,
    exportedAt:new Date().toISOString(),
    entries:state.entries,
    settings:state.settings,
    report:state.report
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='Internly_Backup_'+todayISO()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function importBackup(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(data.app !== 'Internly' || !Array.isArray(data.entries) || !data.settings){
      throw new Error('This file does not look like an Internly backup.');
    }
    if(!confirm('Import this backup? It will replace the entries, internship details and report currently stored on this device.')) return;
    state.entries = data.entries;
    state.settings = Object.assign({}, state.settings, data.settings);
    state.report = data.report || {markdown:'',generatedAt:null};
    await persistLocal();
    alert('Backup imported successfully.');
    render();
  }catch(e){
    alert(e.message || 'Could not read this backup file.');
  }finally{
    ev.target.value='';
  }
}
